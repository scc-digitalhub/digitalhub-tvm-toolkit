# Builds the multi-arch image ghcr.io/scc-digitalhub/tvm-toolkit:<tag> (linux/amd64 and
# linux/arm64) when a tag is pushed. The image tag is the git tag: 0.25 builds Apache TVM
# 0.25.0, 0.26.0 builds 0.26.0. Each architecture compiles TVM natively on its own runner,
# packages the stripped libraries and python/tvm (+ patches/) and pushes <tag>-<arch>; the
# manifest job then publishes <tag>.
name: tvm-toolkit image

on:
  push:
    tags:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/scc-digitalhub/tvm-toolkit
  LLVM_VERSION: "18"
  # shown by GitHub Packages; source links the package to this repository
  DESCRIPTION: "Apache TVM toolkit for DigitalHub tvm+build and tvm+compile (TVM runtime and compiler, LLVM codegen, cross-compilers)"

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tvm: ${{ steps.v.outputs.tvm }}
      tag: ${{ steps.v.outputs.tag }}
      ffi: ${{ steps.v.outputs.ffi }}
    steps:
      - name: Resolve versions from the tag
        id: v
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            echo "::error::run on a tag X.Y or X.Y.Z, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          tvm="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[4]:-0}"
          # apache-tvm-ffi release bundled with each TVM version
          case "$tvm" in
            0.24.*) ffi=0.1.11 ;;
            0.25.*) ffi=0.1.12 ;;
            0.26.*) ffi=0.1.13.post2 ;;
            *) echo "::error::no apache-tvm-ffi mapping for TVM $tvm"; exit 1 ;;
          esac
          {
            echo "tvm=$tvm"
            echo "tag=$GITHUB_REF_NAME"
            echo "ffi=$ffi"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # native runners (same glibc/libstdc++ as the ubuntu:24.04 base image): TVM is
    # compiled on the architecture it will run on, no emulation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      TVM_VERSION: ${{ needs.version.outputs.tvm }}
      TVM_FFI_VERSION: ${{ needs.version.outputs.ffi }}
      REF: ghcr.io/scc-digitalhub/tvm-toolkit:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build ccache \
            "llvm-$LLVM_VERSION" "llvm-$LLVM_VERSION-dev" "libpolly-$LLVM_VERSION-dev" \
            zlib1g-dev libzstd-dev libxml2-dev libedit-dev libffi-dev

      - name: Clone Apache TVM
        run: |
          git clone --depth 1 --branch "v$TVM_VERSION" --recurse-submodules \
            --shallow-submodules https://github.com/apache/tvm "$RUNNER_TEMP/tvm"
          {
            echo "TVM_SRC=$RUNNER_TEMP/tvm"
            echo "TVM_GIT_COMMIT=$(git -C "$RUNNER_TEMP/tvm" rev-parse HEAD)"
            echo "TVM_FFI_GIT_COMMIT=$(git -C "$RUNNER_TEMP/tvm/3rdparty/tvm-ffi" rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-tvm-${{ needs.version.outputs.tvm }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-tvm-${{ needs.version.outputs.tvm }}-${{ matrix.arch }}-

      - name: Build TVM
        id: tvm
        env:
          CCACHE_MAXSIZE: 5G
        run: |
          build="$TVM_SRC/build"
          mkdir -p "$build"
          cp "$TVM_SRC/cmake/config.cmake" "$build/config.cmake"
          # same configuration as the local build-tvm.sh
          {
            echo "set(USE_LLVM \"llvm-config-$LLVM_VERSION\")"
            echo "set(CMAKE_BUILD_TYPE RelWithDebInfo)"
            echo "set(USE_CCACHE AUTO)"
            echo "set(USE_GTEST OFF)"
          } >> "$build/config.cmake"
          cmake -S "$TVM_SRC" -B "$build" -G Ninja
          ninja -C "$build" -j"$(nproc)"
          ls -la "$build/lib"
          ccache --show-stats || true

      # saved even when a later step fails, so a re-run does not recompile TVM
      - name: Save compiler cache
        if: always() && steps.tvm.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-tvm-${{ needs.version.outputs.tvm }}-${{ matrix.arch }}-${{ github.run_id }}

      - name: Stage the image build context
        run: |
          ctx="$GITHUB_WORKSPACE/tvm-toolkit"
          lib="$TVM_SRC/build/lib"
          rm -rf "$ctx/lib" "$ctx/python" "$ctx/provenance.json"
          mkdir -p "$ctx/lib" "$ctx/python"
          for so in libtvm_runtime.so libtvm_runtime_extra.so libtvm_ffi.so libtvm_compiler.so; do
            if [ ! -f "$lib/$so" ]; then
              # libtvm_runtime_extra.so does not exist in every TVM release
              [ "$so" = libtvm_runtime_extra.so ] && continue
              echo "::error::missing $lib/$so"
              exit 1
            fi
            cp "$lib/$so" "$ctx/lib/$so"
            # RelWithDebInfo libraries are huge (libtvm_compiler ~1.4GB)
            strip --strip-debug "$ctx/lib/$so"
          done
          cp -r "$TVM_SRC/python/tvm" "$ctx/python/tvm"
          # setuptools_scm writes this when building a wheel; we ship the source tree
          printf 'version = "%s"\n' "$TVM_VERSION" > "$ctx/python/tvm/_version.py"
          find "$ctx/python" -name __pycache__ -type d -prune -exec rm -rf {} +
          # an unpatched image builds fine and then fails at run time: patches must apply
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            [ -e "$p" ] || break
            echo "== applying $(basename "$p")"
            patch -p1 -d "$ctx/python" --forward --no-backup-if-mismatch < "$p"
          done

      - name: Write provenance.json
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          ctx = Path(os.environ["GITHUB_WORKSPACE"]) / "tvm-toolkit"
          run_url = "{}/{}/actions/runs/{}".format(
              os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]
          )
          manifest = {
              "schema_version": 1,
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platform": "linux/" + os.environ["ARCH"],
              "tvm_version": os.environ["TVM_VERSION"],
              "tvm_git_commit": os.environ["TVM_GIT_COMMIT"],
              "tvm_ffi_version": os.environ["TVM_FFI_VERSION"],
              "tvm_ffi_git_commit": os.environ["TVM_FFI_GIT_COMMIT"],
              "llvm_version": os.environ["LLVM_VERSION"],
              "source_dir": os.environ["TVM_SRC"],
              "build_run": run_url,
              # hashes of the stripped libraries actually shipped in the image
              "libraries": {
                  lib.name: hashlib.sha256(lib.read_bytes()).hexdigest()
                  for lib in sorted((ctx / "lib").glob("*.so"))
              },
          }
          (ctx / "provenance.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          # the labels record which exact TVM this image carries
          docker build -t "$REF" \
            --build-arg "TVM_VERSION=$TVM_VERSION" \
            --build-arg "TVM_FFI_VERSION=$TVM_FFI_VERSION" \
            --build-arg "TVM_GIT_COMMIT=$TVM_GIT_COMMIT" \
            --build-arg "TVM_FFI_GIT_COMMIT=$TVM_FFI_GIT_COMMIT" \
            --build-arg "LLVM_VERSION=$LLVM_VERSION" \
            --label "org.opencontainers.image.version=$TVM_VERSION" \
            --label "org.opencontainers.image.revision=$TVM_GIT_COMMIT" \
            --label "org.digitalhub.tvm-ffi.version=$TVM_FFI_VERSION" \
            --label "org.digitalhub.tvm-ffi.revision=$TVM_FFI_GIT_COMMIT" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.description=$DESCRIPTION" \
            tvm-toolkit
          arch="$(docker image inspect -f '{{.Architecture}}' "$REF")"
          if [ "$arch" != "${{ matrix.arch }}" ]; then
            echo "::error::built $arch instead of ${{ matrix.arch }}"
            exit 1
          fi
          docker run --rm "$REF" python3 -c "import tvm; print('tvm', tvm.__version__)"

      - name: Push image
        run: docker push "$REF"

  manifest:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish the multi-arch tag
        run: |
          # both variants must carry the same TVM (labels are compared byte for byte)
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE:$TAG-$arch" --format '{{json .Image.Config.Labels}}' > "labels-$arch.json"
          done
          if ! cmp labels-amd64.json labels-arm64.json; then
            echo "::error::amd64 and arm64 images carry different TVM labels"
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect --raw "$IMAGE:$TAG" > index.json
          python3 - index.json <<'PY'
          import json
          import sys

          index = json.load(open(sys.argv[1]))
          platforms = sorted(
              "{}/{}".format(m["platform"]["os"], m["platform"]["architecture"])
              for m in index.get("manifests", [])
              if m.get("platform", {}).get("os") != "unknown"
          )
          print("platforms:", platforms)
          sys.exit(0 if platforms == ["linux/amd64", "linux/arm64"] else 1)
          PY
          {
            echo "### Published \`$IMAGE:$TAG\` (linux/amd64, linux/arm64)"
            echo ""
            echo "On the first publish make the package public: organization → Packages → tvm-toolkit → Package settings."
          } >> "$GITHUB_STEP_SUMMARY"
